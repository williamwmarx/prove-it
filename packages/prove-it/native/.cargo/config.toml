# The N-API functions are defined by the process that loads the addon, Node or Bun. Linux leaves a
# shared library's undefined symbols to the loader; macOS has to be told to.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

# No AVX2 assumption on x64. arm64 keeps its default.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

# musl links its C library statically by default, which leaves no cdylib to build, and the addon
# loads into a Node or Bun linked against the system's musl, as on Alpine.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64-v2", "-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]
