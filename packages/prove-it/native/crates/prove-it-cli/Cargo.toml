[package]
name = "prove-it-cli"
description = "The native prove-it binary: checks a TLA+ spec and prints what TLC prints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "prove-it"
path = "src/main.rs"

[dependencies]
prove-it-check = { path = "../prove-it-check" }

[dev-dependencies]
prove-obligations = { path = "../prover/obligations" }
tla-front = { path = "../tla-front" }
tla-ir = { path = "../tla-ir" }
