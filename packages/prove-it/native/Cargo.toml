[workspace]
members = [
  "crates/prove-it-check",
  "crates/prove-it-cli",
  "crates/prove-it-host",
  "crates/prove-it-napi",
  "crates/prove-it-wasm",
  "crates/prover/decide",
  "crates/prover/isabelle",
  "crates/prover/num",
  "crates/prover/obligations",
  "crates/prover/prover",
  "crates/prover/ptl",
  "crates/prover/smt",
  "crates/prover/zenon",
  "crates/tla-engine",
  "crates/tla-front",
  "crates/tla-ir",
  "crates/tla-live",
  "crates/tla-trace",
  "crates/tla-values",
  "tools/replay",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# The binding catches a panic at the boundary and throws it in JavaScript.
panic = "unwind"
