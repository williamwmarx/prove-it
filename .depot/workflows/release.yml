# Publishes packages/prove-it to npm when a commit on main changes its version, then tags the
# commit v<version>. A push that changes package.json but not the version publishes nothing. Run
# it by hand for a first release or to retry one that failed. The native engine's platform packages
# for Linux x64 and arm64 with glibc and with musl, macOS arm64 and x64 and Windows x64 go first,
# each built and tested on its own system (musl in Alpine, macOS and Windows on GitHub's runners, by
# platforms.yml), and the main package lists them as optionalDependencies, added when it is packed;
# other platforms get the TypeScript engine.
#
# The npm token is NPM_TOKEN in the 1Password Environment prove-it-release, whose ID is below.
# ONEPASSWORD_PROVE_IT_RELEASE_TOKEN, a Depot CI secret scoped to this repository, main and this
# file, is the token of a service account that can read that Environment and nothing else. Only
# the publish step holds it, and it runs no package code: it publishes the tarball packed before.
name: Release
"on":
  push:
    branches:
      - main
    paths:
      - packages/prove-it/package.json
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  PACKAGE: "@atemp/prove-it"
  # An identifier, not a secret: reading the Environment takes the service account's token.
  ONEPASSWORD_ENVIRONMENT_ID: tt44zeqhf5ciy4i4jorhug2d6i # gitleaks:allow
jobs:
  # Builds the Linux arm64 engine's platform package on arm64, runs the crates' tests and the unit
  # tests with it searching, and hands the packed tarball to the publish job. It holds no credential.
  arm64:
    name: Build the Linux arm64 engine
    if: github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out exactly the pushed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build, test and pack
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node rust):$PATH"
          bun install --frozen-lockfile --ignore-scripts
          cd packages/prove-it
          (cd native && cargo test --locked)
          bun scripts/platform-packages.ts build
          bun run build
          PROVE_IT_ENGINE_BACKEND=rust PROVE_IT_ENGINE_ADDON="$PWD/native/npm/linux-arm64-gnu/prove-it-engine.node" \
            bun test tests/unit
          platform=$(bun scripts/platform-packages.ts pack "$RUNNER_TEMP/platform-packages")
          echo "Packed $(basename "$platform"), sha256 $(sha256sum "$platform" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Hand the tarball to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-arm64-gnu
          path: ${{ runner.temp }}/platform-packages/
          if-no-files-found: error
          retention-days: 7
  # Builds the Linux musl engines' platform packages on each CPU in Alpine, with
  # scripts/ci/alpine-package.sh: the crates' tests, the native unit tests with the addon and
  # install-test, then the packed tarball for the publish job. It holds no credential.
  musl:
    name: Build the Linux ${{ matrix.cpu }} musl engine
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - cpu: x64
            runner: depot-ubuntu-24.04
          - cpu: arm64
            runner: depot-ubuntu-24.04-arm
    steps:
      - name: Check out exactly the pushed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build, test and pack on Alpine
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/repo" \
            alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f \
            /repo/scripts/ci/alpine-package.sh
          platform=$(ls platform-packages/*-linux-${{ matrix.cpu }}-musl-*.tgz)
          echo "Packed $(basename "$platform"), sha256 $(sha256sum "$platform" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Hand the tarball to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-${{ matrix.cpu }}-musl
          path: platform-packages/*-linux-${{ matrix.cpu }}-musl-*.tgz
          if-no-files-found: error
          retention-days: 7
  release:
    name: Publish to npm
    needs:
      - arm64
      - musl
    if: github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    # The Depot secret is scoped to the npm environment, as well as to main and this file.
    environment: npm
    permissions:
      # To push the v<version> tag.
      contents: write
      # To take the macOS and Windows packages from platforms.yml's run.
      actions: read
    steps:
      - name: Check out exactly the pushed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan (publish only a version npm doesn't have)
        id: plan
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh node):$PATH"
          version=$(node -p 'require("./packages/prove-it/package.json").version')
          name=$(node -p 'require("./packages/prove-it/package.json").name')
          [[ "$name" == "$PACKAGE" ]] || { echo "package.json names $name, not $PACKAGE" >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            previous=$(git show HEAD^:packages/prove-it/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            if [[ "$previous" == "$version" ]]; then
              echo "The version is still $version, so this push releases nothing" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if published=$(npm view "$PACKAGE@$version" version 2>/dev/null) && [[ "$published" == "$version" ]]; then
            echo "$PACKAGE@$version is already on npm" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install dependencies (no install scripts)
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node):$PATH"
          bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck, lint, test and build
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node):$PATH"
          bun run typecheck
          bun run lint
          bun run format:check
          bun run test
          test -z "$(git status --porcelain)"
      - name: Fetch the Linux arm64 engine
        if: steps.plan.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-arm64-gnu
          path: ${{ runner.temp }}/fetched
      - name: Fetch the Linux musl engines
        if: steps.plan.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: linux-*-musl
          merge-multiple: true
          path: ${{ runner.temp }}/fetched
      # platforms.yml builds, tests and packs the macOS and Windows engines on GitHub's runners, on the
      # push of this same commit. This waits for that run, which the job's timeout bounds, fails unless
      # it passed, and takes the packages it packed.
      - name: Fetch the macOS and Windows engines
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh node):$PATH"
          api() {
            curl --fail --silent --show-error --location --retry 5 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1"
          }
          runs="https://api.github.com/repos/$REPOSITORY/actions/workflows/platforms.yml/runs?head_sha=$GITHUB_SHA&per_page=1"
          while :; do
            run=$(api "$runs" | node -p '
              const run = JSON.parse(require("fs").readFileSync(0, "utf8")).workflow_runs[0];
              run ? `${run.id} ${run.status} ${run.conclusion}` : "none pending none"') || run="none pending none"
            read -r id status conclusion <<< "$run"
            [[ "$status" == completed ]] && break
            sleep 30
          done
          [[ "$conclusion" == success ]] || { echo "platforms.yml run $id of $GITHUB_SHA ended $conclusion" >&2; exit 1; }
          for name in darwin-arm64 darwin-x64 win32-x64-msvc; do
            url=$(api "https://api.github.com/repos/$REPOSITORY/actions/runs/$id/artifacts?name=$name" |
              node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).artifacts[0].archive_download_url')
            api "$url" > "$RUNNER_TEMP/$name.zip"
            unzip -o -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/fetched"
          done
      # Builds the Linux x64 engine's platform package, then lists every platform package in the main
      # package's optionalDependencies, at its own version, as the main package is packed.
      - name: Pack
        id: pack
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node rust):$PATH"
          cd packages/prove-it
          bun scripts/platform-packages.ts build
          platform=$(bun scripts/platform-packages.ts pack "$RUNNER_TEMP/platform-packages")
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "Packed $(basename "$platform"), sha256 $(sha256sum "$platform" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          for name in linux-arm64-gnu linux-x64-musl linux-arm64-musl darwin-arm64 darwin-x64 win32-x64-msvc; do
            fetched=$(ls "$RUNNER_TEMP"/fetched/*-"$name"-*.tgz)
            echo "Fetched $(basename "$fetched"), sha256 $(sha256sum "$fetched" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          node -e '
            const fs = require("fs");
            const main = JSON.parse(fs.readFileSync("package.json", "utf8"));
            main.optionalDependencies = Object.fromEntries(
              [
                "linux-x64-gnu",
                "linux-arm64-gnu",
                "linux-x64-musl",
                "linux-arm64-musl",
                "darwin-arm64",
                "darwin-x64",
                "win32-x64-msvc",
              ].map((name) => [
                `${main.name}-${name}`,
                main.version,
              ]),
            );
            fs.writeFileSync("package.json", `${JSON.stringify(main, null, 2)}\n`);
          '
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          git checkout -- package.json
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball, sha256 $(sha256sum "$RUNNER_TEMP/$tarball" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
      # op run puts NPM_TOKEN in npm's environment alone; the npmrc names the variable, not the
      # value, and npm expands it.
      - name: Publish the packed tarball
        if: steps.plan.outputs.publish == 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.ONEPASSWORD_PROVE_IT_RELEASE_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          PLATFORM: ${{ steps.pack.outputs.platform }}
        run: |
          set -euo pipefail
          [[ -n "$ONEPASSWORD_ENVIRONMENT_ID" ]] || { echo "set ONEPASSWORD_ENVIRONMENT_ID in this workflow" >&2; exit 1; }
          [[ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]] || { echo "the Depot secret ONEPASSWORD_PROVE_IT_RELEASE_TOKEN is missing" >&2; exit 1; }
          PATH="$(scripts/ci/bootstrap.sh node op):$PATH"
          npmrc="$RUNNER_TEMP/npmrc"
          # shellcheck disable=SC2016 # npm expands ${NPM_TOKEN} itself, so the shell must not.
          printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$npmrc"
          # A retry skips a package an earlier attempt published.
          for tarball in "$PLATFORM" "$RUNNER_TEMP"/fetched/*.tgz "$TARBALL"; do
            spec=$(tar -xOzf "$tarball" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); `${p.name}@${p.version}`')
            if [[ "$(npm view "$spec" version 2>/dev/null)" != "" ]]; then
              echo "$spec is already on npm" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            NPM_CONFIG_USERCONFIG="$npmrc" op run --environment "$ONEPASSWORD_ENVIRONMENT_ID" -- \
              npm publish "$tarball" --access public --ignore-scripts
          done
          rm -f "$npmrc"
          echo "Published $PACKAGE@${{ steps.plan.outputs.version }} and its Linux (glibc and musl), macOS and Windows engines" >> "$GITHUB_STEP_SUMMARY"
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          PUBLISHED: ${{ steps.plan.outputs.publish }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            [[ "$existing" == "$GITHUB_SHA" ]] && exit 0
            # An earlier commit already released this version; npm has it, so there's nothing to tag.
            echo "$tag already tags $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PATH="$(scripts/ci/bootstrap.sh node):$PATH"
          # npm can take minutes to serve a version it has just accepted, so after a publish this
          # waits until it does; a version this run didn't publish and npm lacks isn't tagged.
          until [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null || true)" == "$VERSION" ]]; do
            [[ "$PUBLISHED" == true ]] || exit 0
            sleep 15
          done
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git tag "$tag" "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "refs/tags/$tag"
