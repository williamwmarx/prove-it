# Checks that Prove It still agrees with TLC on the conformance corpora, on one large machine:
# Conformance runs every model whose TLC result tests/conformance/expected.json records and fails
# if a model tests/conformance/passing.json lists no longer matches it; Engine coverage runs every
# model with the engine on and off and fails if the two reach different outcomes; Differential
# compares Prove It's full output, with the engine, without it, and stopped part way, with TLC's
# recorded in tests/conformance/tlc-stdout, and fails on a difference
# tests/conformance/known-differences.json doesn't list; it then runs the native binary alone, as
# it ships, with tla-front as its front end, and fails on a difference with TLC that file doesn't
# list. It runs by hand and on every push to main, never on a pull request, and holds no
# credential. Each job's results are its artifact.
name: Parity
"on":
  workflow_dispatch:
    inputs:
      filter:
        description: Only the models whose id contains this text
        default: ""
      max_tlc_ms:
        description: Leave out the models TLC took longer than this to check
        default: "20000"
  push:
    branches:
      - main
permissions:
  contents: read
# Pushes to main take turns: a run in progress always finishes, and only the newest push waits
# behind it, so with merges coming faster than a run takes, every run still ends with a result for
# the commit it checked. A run by hand checks one change, which may share its ref with other changes
# run by hand, so each gets a group of its own.
concurrency:
  group: parity-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false
env:
  NPM_TOKEN: ""
  NODE_AUTH_TOKEN: ""
  OP_SERVICE_ACCOUNT_TOKEN: ""
  ONEPASSWORD_PROVE_IT_RELEASE_TOKEN: ""
jobs:
  conformance:
    name: Conformance
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build Prove It and its native engine, and fetch the corpora
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node rust):$PATH"
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          cd packages/prove-it
          bun scripts/platform-packages.ts build
          bun scripts/fetch-corpora.ts
      - name: Compare with TLC's recorded results
        env:
          FILTER: ${{ inputs.filter || '' }}
          MAX_TLC_MS: ${{ inputs.max_tlc_ms || '20000' }}
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node):$PATH"
          cd packages/prove-it
          mkdir -p "$RUNNER_TEMP/parity"
          status=0
          export PROVE_IT_ENGINE_ADDON="$PWD/native/npm/linux-x64-gnu/prove-it-engine.node"
          bun scripts/run.ts conformance --check --concurrency 12 --max-tlc-ms "$MAX_TLC_MS" \
            ${FILTER:+--filter "$FILTER"} | tee "$RUNNER_TEMP/parity/conformance.log" || status=$?
          cp tests/conformance/.results.json "$RUNNER_TEMP/parity/conformance.json"
          {
            echo "## Conformance"
            echo
            echo '```'
            sed -n '/^match: \|^mismatch: \|^unsupported: \|^crash: /p; /models match that\|no longer match/,$p' \
              "$RUNNER_TEMP/parity/conformance.log" | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parity/
          if-no-files-found: warn
          retention-days: 90
  differential:
    name: Differential
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build Prove It and its native engine, and fetch the corpora
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node rust):$PATH"
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          cd packages/prove-it
          bun scripts/platform-packages.ts build
          (cd native && cargo build --release --locked -p prove-it-cli)
          bun scripts/fetch-corpora.ts
      # The jar TLC's recordings were made with, whose -loadTrace reads back each trace file the
      # TLC-default comparison sees, as the Record TLC workflow builds it.
      - name: Build TLC
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun java ant):$PATH"
          tlc_commit="$(cd packages/prove-it && bun -e 'import { TLC_COMMIT } from "./scripts/tlc-recordings"; console.log(TLC_COMMIT)')"
          tlaplus="$RUNNER_TEMP/tlaplus"
          git init -q "$tlaplus"
          git -C "$tlaplus" remote add origin https://github.com/tlaplus/tlaplus.git
          git -C "$tlaplus" sparse-checkout set tlatools/org.lamport.tlatools
          git -C "$tlaplus" fetch -q --depth 1 --filter=blob:none origin "$tlc_commit"
          git -C "$tlaplus" checkout -q FETCH_HEAD
          mkdir -p "$tlaplus/tlatools/org.lamport.tlatools/test-class"
          JAVA_HOME="$(cd "$(dirname "$(command -v java)")/.." && pwd)"
          export JAVA_HOME
          unset ANT_HOME
          ant --noconfig -f "$tlaplus/tlatools/org.lamport.tlatools/customBuild.xml" compile dist
      - name: Compare the full output with TLC's
        env:
          FILTER: ${{ inputs.filter || '' }}
          MAX_TLC_MS: ${{ inputs.max_tlc_ms || '20000' }}
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node):$PATH"
          cd packages/prove-it
          mkdir -p "$RUNNER_TEMP/parity"
          status=0
          export PROVE_IT_ENGINE_ADDON="$PWD/native/npm/linux-x64-gnu/prove-it-engine.node"
          bun scripts/run.ts differential --concurrency 12 \
            --max-tlc-ms "$MAX_TLC_MS" \
            ${FILTER:+--filter "$FILTER"} --out "$RUNNER_TEMP/parity/differential.json" \
            | tee "$RUNNER_TEMP/parity/differential.log" || status=$?
          {
            echo "## Differential"
            echo
            echo '```'
            sed -n '/^┌/,$p' "$RUNNER_TEMP/parity/differential.log" | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Compare the native binary's output with TLC's
        if: success() || failure()
        env:
          FILTER: ${{ inputs.filter || '' }}
          MAX_TLC_MS: ${{ inputs.max_tlc_ms || '20000' }}
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node):$PATH"
          cd packages/prove-it
          mkdir -p "$RUNNER_TEMP/parity"
          status=0
          bun scripts/run.ts differential --native-only --concurrency 12 \
            --max-tlc-ms "$MAX_TLC_MS" --native "$PWD/native/target/release/prove-it" \
            ${FILTER:+--filter "$FILTER"} --out "$RUNNER_TEMP/parity/differential-native.json" \
            | tee "$RUNNER_TEMP/parity/differential-native.log" || status=$?
          {
            echo "## Differential of the native binary"
            echo
            echo '```'
            sed -n '/^native:/,$p' "$RUNNER_TEMP/parity/differential-native.log" | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # The same runs in TLC's own default, which records the trace for its trace exploration
      # spec, against TLC's recordings without -noGenerateSpecTE: the trace exploration files TLC
      # writes are part of each run's output, each .bin as what the jar's -loadTrace reads back.
      - name: Compare the native binary's output with TLC's in TLC's own default
        if: success() || failure()
        env:
          FILTER: ${{ inputs.filter || '' }}
          MAX_TLC_MS: ${{ inputs.max_tlc_ms || '20000' }}
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node java):$PATH"
          export TLA2TOOLS_JAR="$RUNNER_TEMP/tlaplus/tlatools/org.lamport.tlatools/dist/tla2tools.jar"
          cd packages/prove-it
          mkdir -p "$RUNNER_TEMP/parity"
          status=0
          bun scripts/run.ts differential --native-only --modes te --concurrency 12 \
            --max-tlc-ms "$MAX_TLC_MS" --native "$PWD/native/target/release/prove-it" \
            ${FILTER:+--filter "$FILTER"} --out "$RUNNER_TEMP/parity/differential-native-te.json" \
            | tee "$RUNNER_TEMP/parity/differential-native-te.log" || status=$?
          {
            echo "## Differential of the native binary in TLC's own default"
            echo
            echo '```'
            sed -n '/^native:/,$p' "$RUNNER_TEMP/parity/differential-native-te.log" | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # The same runs, each searching on four threads with levels of 64 states or more shared
      # between them: the binary must print what it prints on one thread, so it is compared with
      # the same recordings of TLC on one worker.
      - name: Compare the native binary's output with TLC's on four threads
        if: success() || failure()
        env:
          FILTER: ${{ inputs.filter || '' }}
          MAX_TLC_MS: ${{ inputs.max_tlc_ms || '20000' }}
          PROVE_IT_WORKERS: "4"
          PROVE_IT_SHARED_LEVEL: "64"
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node):$PATH"
          cd packages/prove-it
          mkdir -p "$RUNNER_TEMP/parity"
          status=0
          bun scripts/run.ts differential --native-only --concurrency 4 \
            --max-tlc-ms "$MAX_TLC_MS" --native "$PWD/native/target/release/prove-it" \
            ${FILTER:+--filter "$FILTER"} --out "$RUNNER_TEMP/parity/differential-native-threads.json" \
            | tee "$RUNNER_TEMP/parity/differential-native-threads.log" || status=$?
          {
            echo "## Differential of the native binary on four threads"
            echo
            echo '```'
            sed -n '/^native:/,$p' "$RUNNER_TEMP/parity/differential-native-threads.log" | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: differential-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parity/
          if-no-files-found: warn
          retention-days: 90
