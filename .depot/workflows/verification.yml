# Every pull request from this repository and every push to main. Holds no credential: the env
# below blanks every one a step could publish with. Gate is the one check a ruleset should
# require. Depot CI doesn't run pull requests from forks yet.
name: Verification
"on":
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group:
    verification-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}',
    github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NPM_TOKEN: ""
  NODE_AUTH_TOKEN: ""
  OP_SERVICE_ACCOUNT_TOKEN: ""
  ONEPASSWORD_PROVE_IT_RELEASE_TOKEN: ""
jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: Build
            command: bun run build
          - task: Typecheck
            command: bun run typecheck
          - task: Lint
            command: bun run lint && bun run format:check
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Some tests and the conformance scripts run node, so it's on PATH too.
      - name: Install dependencies
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node):$PATH"
          bun install --frozen-lockfile --ignore-scripts
      - name: Run ${{ matrix.task }}
        env:
          COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node):$PATH"
          bash -c "$COMMAND"
          test -z "$(git status --porcelain)"
  # The native engine's Rust workspace, and its addon loaded by Bun, Node, and the npm packages.
  native:
    name: ${{ matrix.task }}
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: Cargo Build
            # The native tests load the addon in Bun from the sources and in Node from dist, the
            # store and fingerprint tests run on the native store too, and the native search's tests
            # compare it with the interpreter.
            command: |
              cd packages/prove-it
              bun scripts/platform-packages.ts build
              bun run build
              PROVE_IT_ENGINE_ADDON="$PWD/native/npm/linux-x64-gnu/prove-it-engine.node" bun test tests/unit/native.test.ts tests/unit/native-search.test.ts tests/unit/engine-store.test.ts tests/unit/engine-fingerprints.test.ts tests/unit/deciders.test.ts
          # The engine as WebAssembly: its code for wasm32 linted, then the native tests with it
          # standing in for the addon, as where there is no process.dlopen (DESIGN.md 7.4).
          - task: WebAssembly
            command: |
              cd packages/prove-it
              (cd native && cargo clippy --locked --target wasm32-unknown-unknown -p prove-it-wasm -- -D warnings)
              bun scripts/platform-packages.ts build
              bun run build
              bun scripts/platform-packages.ts build --target wasm32-unknown-unknown
              PROVE_IT_ENGINE_ADDON="$PWD/native/npm/linux-x64-gnu/prove-it-engine.node" PROVE_IT_ENGINE_WASM="$PWD/dist/prove-it-engine.wasm" bun test tests/unit/native.test.ts tests/unit/native-search.test.ts tests/unit/engine-store.test.ts tests/unit/engine-fingerprints.test.ts tests/unit/deciders.test.ts
          # Every unit test, with the native engine that bun run test builds searching
          # (tests/setup.ts).
          - task: Test
            command: bun run test
          # The Rust front end against the TypeScript one, on every module of the corpora and the
          # fixtures (native/DESIGN.md section 14). resolve and ir link each module as a spec's root
          # and lower it; model, order and model-ir link, order and lower each corpus model. The
          # binary prints what TLC printed, as recorded, on SANY's corpus and the RECURSIVE grid, and
          # what SANY's XMLExporter printed on SANY's corpus and the XML fixtures, with each flag set.
          - task: Front End
            command: |
              cd packages/prove-it
              bun scripts/front-modules.ts --check
              bun scripts/fetch-corpora.ts
              cd native && cargo build --release --locked -p tla-front --bin front-dump -p prove-it-cli --bin prove-it && cd ..
              for mode in tokens ast sany-ast config resolve model ir order model-ir; do
                bun scripts/front-differential.ts "$mode" --mutate 400 --rust native/target/release/front-dump
              done
              bun scripts/sany-corpus.ts --recorded tests/conformance/sany-stdout/corpus.json
              bun scripts/sany-corpus.ts --specs native/crates/tla-front/tests/recursive-shapes --recorded tests/conformance/sany-stdout/grid.json
              bun scripts/front-differential.ts sany-xml --rust native/target/release/front-dump
              xml=tests/conformance/sany-stdout/xml
              for flags in "-o" "-o -t" "-o -r" "-o -u" "-o -t -r -u"; do
                bun scripts/sany-corpus.ts --recorded "$xml$(echo "$flags" | tr -d ' ').json" --main tla2sany.xml.XMLExporter --arguments "$flags"
              done
              fixtures="--specs tests/fixtures/xml-export --main tla2sany.xml.XMLExporter"
              names=Commented,Counted,DefineStep,FormFeed,LevelError,Nesting,Numbered,Renamed,Twice
              bun scripts/sany-corpus.ts $fixtures --recorded "$xml-fixtures-o.json" --arguments "-o" --names "$names"
              bun scripts/sany-corpus.ts $fixtures --recorded "$xml-fixtures-o-t-r-u.json" --arguments "-o -t -r -u" --names "$names"
              bun scripts/sany-corpus.ts $fixtures --recorded "$xml-fixtures-include.json" --arguments "-o -I nested" --names Missing,Root
          # Every corpus model lowered to the engine IR, which round-trips through Rust, and the
          # golden models' IR, which must match tests/conformance/ir: a change to the lowering
          # updates them (`bun scripts/run.ts engine-ir --update`).
          - task: Engine IR
            command: |
              cd packages/prove-it
              bun scripts/fetch-corpora.ts
              bun scripts/run.ts engine-ir --concurrency 8
          # The standalone executable with the native engine embedded, which build-binary.ts runs on
          # models that need what it embeds.
          - task: Binary
            command: |
              cd packages/prove-it
              bun scripts/platform-packages.ts build
              bun run build:binary
          - task: Cargo Test
            command: cd packages/prove-it/native && cargo test --locked
          - task: Cargo Clippy
            command: cd packages/prove-it/native && cargo clippy --locked --all-targets -- -D warnings
          - task: Cargo Fmt
            command: cd packages/prove-it/native && cargo fmt --check
          # Packs the main package and the platform package as release.yml does, then installs them
          # without scripts: the main package without its WebAssembly engine or a platform package
          # exits 255 for want of an engine, naming PROVE_IT_ENGINE=0, which checks with the
          # interpreter; with the engine as WebAssembly in its dist it searches the model with that,
          # and with its platform package it loads the addon.
          - task: Packages
            command: |
              cd packages/prove-it
              bun scripts/platform-packages.ts build
              bun run build
              packs="$RUNNER_TEMP/packs"
              mkdir -p "$packs/bare"
              bare=$(npm pack --silent --pack-destination "$packs/bare")
              bun scripts/platform-packages.ts build --target wasm32-unknown-unknown
              main=$(npm pack --silent --pack-destination "$packs")
              bun scripts/platform-packages.ts pack "$packs"
              install="$RUNNER_TEMP/install"
              mkdir -p "$install"
              cp tests/fixtures/commit/Commit.* "$install"
              cd "$install"
              npm init -y > /dev/null
              npm install --ignore-scripts --no-audit --no-fund "$packs/bare/$bare"
              status=0
              npx --no prove-it Commit.cfg 2> engine.log > /dev/null || status=$?
              test "$status" -eq 255
              grep -q '^The native engine is unavailable: no @atemp/prove-it-linux-x64-gnu' engine.log
              PROVE_IT_ENGINE=0 npx --no prove-it Commit.cfg | grep -q '251 distinct states found'
              npm install --ignore-scripts --no-audit --no-fund "$packs/$main"
              PROVE_IT_ENGINE=debug npx --no prove-it Commit.cfg 2> engine.log > /dev/null
              grep -q '^\[engine\] native: complete: ' engine.log
              npm install --ignore-scripts --no-audit --no-fund "$packs"/atemp-prove-it-linux-x64-gnu-*.tgz
              PROVE_IT_ENGINE=debug npx --no prove-it Commit.cfg 2> engine.log > /dev/null
              grep -q '^\[engine\] native: complete: ' engine.log
              grep -q '^\[engine\] checked 251 states on 1 thread ' engine.log
              # The platform package's native binary runs with an empty environment, no node or bun.
              binary=node_modules/@atemp/prove-it-linux-x64-gnu/bin/prove-it
              test -x "$binary"
              status=0
              env -i "$binary" 2> usage.log || status=$?
              test "$status" -eq 1
              grep -q '^Usage: tla-ts ' usage.log
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node rust rust-wasm32):$PATH"
          bun install --frozen-lockfile --ignore-scripts
      - name: Run ${{ matrix.task }}
        env:
          COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node rust rust-wasm32):$PATH"
          bash -euo pipefail -c "$COMMAND"
          test -z "$(git status --porcelain)"
  # The native engine's musl packages, built and tested on Alpine by scripts/ci/alpine-package.sh,
  # which ends with the packed packages installed with npm and searching natively.
  musl:
    name: ${{ matrix.task }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: Alpine x64
            runner: depot-ubuntu-24.04
          - task: Alpine arm64
            runner: depot-ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build, test, install and pack on Alpine
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/repo" \
            alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f \
            /repo/scripts/ci/alpine-package.sh
  # fetch-depth 0 so a secret a later commit deleted is still found. The repository is public, so
  # any finding is a leaked credential to revoke, not to allowlist.
  secret-history:
    name: Secret History
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan git history for credentials
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh gitleaks):$PATH"
          gitleaks git --no-banner --redact --log-opts=HEAD .
  gate:
    name: Gate
    if: always()
    needs:
      - checks
      - native
      - musl
      - secret-history
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every result
        env:
          CHECKS: ${{ needs.checks.result }}
          NATIVE: ${{ needs.native.result }}
          MUSL: ${{ needs.musl.result }}
          SECRET_HISTORY: ${{ needs.secret-history.result }}
        run: |
          set -euo pipefail
          {
            echo "## Verification"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| checks | $CHECKS |"
            echo "| native | $NATIVE |"
            echo "| musl | $MUSL |"
            echo "| secret-history | $SECRET_HISTORY |"
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CHECKS" == success && "$NATIVE" == success && "$MUSL" == success && "$SECRET_HISTORY" == success ]]
