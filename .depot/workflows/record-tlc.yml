# Records Java TLC's full output on the corpus models, in the default output and with -tool, for
# packages/prove-it/scripts/differential.ts to compare Prove It's with: TLC is built from
# TLC_COMMIT in packages/prove-it/scripts/tlc-recordings.ts, as the Benchmark workflow builds it, and
# record-tlc.ts --stdout records each model expected.json lists under max_tlc_ms that has no
# recording yet, then adds TLC's fingerprint estimates to expected.json. With outcomes, it instead
# records TLC's outcome on every corpus model in expected.json, keeping the entries of the models
# the first recorder stopped TLC on at 300 s (record-tlc.ts --keep-unfinished). It runs by hand only and
# holds no credential. The recordings and expected.json are its artifact, to commit to
# packages/prove-it/tests/conformance.
name: Record TLC
"on":
  workflow_dispatch:
    inputs:
      filter:
        description: Only the models whose id contains this text
        default: ""
      max_tlc_ms:
        description: Leave out the models TLC took longer than this to check
        default: "20000"
      outcomes:
        description: Record TLC's outcome on every model in expected.json instead of its output
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: record-tlc
  cancel-in-progress: false
env:
  NPM_TOKEN: ""
  NODE_AUTH_TOKEN: ""
  OP_SERVICE_ACCOUNT_TOKEN: ""
  ONEPASSWORD_PROVE_IT_RELEASE_TOKEN: ""
jobs:
  record:
    name: Record TLC's output
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build TLC
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun java ant):$PATH"
          tlc_commit="$(cd packages/prove-it && bun -e 'import { TLC_COMMIT } from "./scripts/tlc-recordings"; console.log(TLC_COMMIT)')"
          echo "TLC_COMMIT=$tlc_commit" >> "$GITHUB_ENV"
          # As the Benchmark workflow: TLC's build reads its git history only to stamp the jar.
          tlaplus="$RUNNER_TEMP/tlaplus"
          git init -q "$tlaplus"
          git -C "$tlaplus" remote add origin https://github.com/tlaplus/tlaplus.git
          git -C "$tlaplus" sparse-checkout set tlatools/org.lamport.tlatools
          git -C "$tlaplus" fetch -q --depth 1 --filter=blob:none origin "$tlc_commit"
          git -C "$tlaplus" checkout -q FETCH_HEAD
          mkdir -p "$tlaplus/tlatools/org.lamport.tlatools/test-class"
          JAVA_HOME="$(cd "$(dirname "$(command -v java)")/.." && pwd)"
          export JAVA_HOME
          unset ANT_HOME
          ant --noconfig -f "$tlaplus/tlatools/org.lamport.tlatools/customBuild.xml" compile dist
      - name: Fetch the corpora
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun):$PATH"
          bun install --frozen-lockfile --ignore-scripts
          cd packages/prove-it
          bun scripts/fetch-corpora.ts
      - name: Record TLC's output
        env:
          FILTER: ${{ inputs.filter || '' }}
          MAX_TLC_MS: ${{ inputs.max_tlc_ms || '20000' }}
          OUTCOMES: ${{ inputs.outcomes && 'true' || 'false' }}
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun java):$PATH"
          export TLA2TOOLS_JAR="$RUNNER_TEMP/tlaplus/tlatools/org.lamport.tlatools/dist/tla2tools.jar"
          cd packages/prove-it
          # Each TLC runs one worker with a 768 MB heap, so 12 leave room for the collectors. The
          # outcomes keep the entries of models the first recorder stopped TLC on at 300 s.
          if [ "$OUTCOMES" = true ]; then
            bun scripts/record-tlc.ts --keep-unfinished --concurrency 12 \
              | tee "$RUNNER_TEMP/record-tlc.log"
          else
            bun scripts/record-tlc.ts --stdout --concurrency 12 --max-tlc-ms "$MAX_TLC_MS" \
              ${FILTER:+--filter "$FILTER"} | tee "$RUNNER_TEMP/record-tlc.log"
          fi
          tail -1 "$RUNNER_TEMP/record-tlc.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the recordings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tlc-stdout-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/prove-it/tests/conformance/tlc-stdout/
            packages/prove-it/tests/conformance/expected.json
          if-no-files-found: warn
          retention-days: 90
