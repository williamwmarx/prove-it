# Publishes packages/prove-it to npm when a commit on main changes its version, then tags the
# commit v<version>. Run it by hand to retry a release that failed.
#
# This is the one workflow on GitHub Actions; verification runs on Depot CI. npm's trusted
# publishing accepts only GitHub-hosted runners and a workflow in .github/workflows, and it
# trusts this file by name (set on the package's npm settings page), so no npm token exists.
# npm adds a provenance statement on its own.
name: Release

on:
  push:
    branches: [main]
    paths:
      - packages/prove-it/package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: "@atemp/prove-it"

jobs:
  release:
    name: Publish to npm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      # To push the v<version> tag.
      contents: write
      # Trusted publishing and provenance both take the job's OIDC token.
      id-token: write
    steps:
      - name: Check out exactly the pushed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan (publish only a version npm doesn't have)
        id: plan
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh node):$PATH"
          version=$(node -p 'require("./packages/prove-it/package.json").version')
          name=$(node -p 'require("./packages/prove-it/package.json").name')
          [[ "$name" == "$PACKAGE" ]] || { echo "package.json names $name, not $PACKAGE" >&2; exit 1; }
          if published=$(npm view "$PACKAGE@$version" version 2>/dev/null) && [[ "$published" == "$version" ]]; then
            echo "$PACKAGE@$version is already on npm" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (no install scripts)
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node):$PATH"
          bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck, lint, test and build
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node):$PATH"
          bun run typecheck
          bun run lint
          bun run format:check
          bun run test
          test -z "$(git status --porcelain)"

      - name: Pack
        id: pack
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh bun node):$PATH"
          cd packages/prove-it
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball, sha256 $(sha256sum "$RUNNER_TEMP/$tarball" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"

      # npm 11.5.1 or later trades the job's OIDC token for a short-lived publish token. npm's
      # trusted publisher settings live on the package's page, so the first version is published
      # with a one-time token in the NPM_TOKEN secret, deleted once trusted publishing is set.
      - name: Publish the packed tarball
        if: steps.plan.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          PATH="$(scripts/ci/bootstrap.sh node):$PATH"
          if [[ -n "$NPM_TOKEN" ]]; then
            # The npmrc names the variable, not the value; npm expands it.
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
            printf '//registry.npmjs.org/:_authToken=${NPM_TOKEN}\n' > "$NPM_CONFIG_USERCONFIG"
          fi
          npm publish "$TARBALL" --access public --provenance --ignore-scripts
          echo "Published $PACKAGE@$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            [[ "$existing" == "$GITHUB_SHA" ]] || echo "$tag already tags $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm_version=$(PATH="$(scripts/ci/bootstrap.sh node):$PATH" npm view "$PACKAGE@$VERSION" version 2>/dev/null || true)
          [[ "$npm_version" == "$VERSION" ]] || exit 0
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git tag "$tag" "$GITHUB_SHA"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "refs/tags/$tag"
